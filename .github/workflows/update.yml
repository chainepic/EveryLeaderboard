name: Update due boards

on:
  schedule:
    # Wake hourly; scripts/run_due.py filters by each board's cadence.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate schemas
        run: python scripts/validate.py

      - name: Run due connectors
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/run_due.py

      - name: Rebuild catalog
        run: python scripts/rebuild_catalog.py

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boards catalogs
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update due leaderboard snapshots"
            git push
          fi
